<!DOCTYPE html>
<html>
<head>
    <title>Twoje Wiadomości</title>
    <style>
        .unread { font-weight: bold; }
    </style>
</head>
<body>
    <h2>Skrzynka odbiorcza</h2>
    <table border="1" style="width:100%">
        <tr>
            <th>Od</th>
            <th>Temat</th>
            <th>Data</th>
        </tr>
        {% for message in messages %}
        <tr class="{{ 'unread' if not message.is_read else '' }}">
            <td>{{ message.sender_username }}</td>
            <td><a href="{{ url_for('view_message', message_id=message.id) }}">{{ message.subject }}</a></td>
            <td>{{ message.timestamp }}</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="3">Brak wiadomości.</td>
        </tr>
        {% endfor %}
    </table>
    <p><a href="{{ url_for('dashboard') }}">Powrót do pulpitu</a></p>
</body>
</html>
