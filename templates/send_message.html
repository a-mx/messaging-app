<!DOCTYPE html>
<html>
<head>
    <title>Nowa Wiadomość</title>
</head>
<body>
    <h2>Wyślij nową wiadomość</h2>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div style="color: red;">
        {% for message in messages %}
          <p>{{ message }}</p>
        {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    <form method="post">
        <div>
            <label for="recipient">Do (nazwa użytkownika):</label><br>
            <input type="text" id="recipient" name="recipient" required>
        </div>
        <div>
            <label for="subject">Temat:</label><br>
            <input type="text" id="subject" name="subject" required>
        </div>
        <div>
            <label for="body">Treść:</label><br>
            <textarea id="body" name="body" rows="10" cols="50" required></textarea>
        </div>
        <div>
            <input type="submit" value="Wyślij">
        </div>
    </form>
    <p><a href="{{ url_for('dashboard') }}">Anuluj</a></p>
</body>
</html>
