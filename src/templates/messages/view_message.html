<html>
<head>
    <title>Decrypt Message</title>
</head>
<body>
    <h2>Decrypt Message: {{ message.subject }}</h2>
    <p>To view this encrypted message, please enter your login password.</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div style="color: red;">
        {% for message in messages %}
          <p>{{ message }}</p>
        {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    <form method="post">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <input type="submit" value="Decrypt">
    </form>
</body>
</html>
