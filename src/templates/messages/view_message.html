{% extends "base.html" %}
{% block title %}Decrypt Message{% endblock %}

{% block content %}
<h2>Decrypt Message: {{ message.subject }}</h2>
<p>To view this encrypted message, please enter your login password.</p>

<form method="post">
    {{ form.hidden_tag() }}
    <label for="password">Password:</label>
    {{ form.password(id="password") }}
    <input type="submit" value="Decrypt">
</form>
{% endblock %}
