<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}Messaging app{% endblock %}</title>
  {% block head %}{% endblock %}
</head>
<body>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div style="color: red; margin-bottom: 10px;">
        {% for message in messages %}
          <p>{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}

  {% block scripts %}{% endblock %}
</body>
</html>
