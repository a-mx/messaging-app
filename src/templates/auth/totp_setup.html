<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Set up 2FA</title>
  </head>
  <body>
    <h1>Set up 2FA</h1>
    <img alt="TOTP QR" src="data:image/png;base64,{{ qr_b64 }}" />

    <p>If you can’t scan, enter this secret manually:</p>
    <pre>{{ secret }}</pre>

    <p>Account: <b>{{ username }}</b> / Issuer: <b>{{ issuer }}</b></p>

    <p><a href="{{ url_for('auth.login') }}">Go to login</a></p>
  </body>
</html>
