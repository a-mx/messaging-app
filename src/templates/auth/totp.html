{% extends "base.html" %}

{% block title %}2FA{% endblock %}

{% block content %}

<h1>Two-Factor Authentication</h1>

<form method="post">
  {{ form.hidden_tag() }}

  <label for="code">Authenticator code</label><br />

  {{ form.code(id="code", autocomplete="one-time-code", inputmode="numeric") }}

  <button type="submit">Verify</button>
  
</form>

<p><a href="{{ url_for('auth.login') }}">Back</a></p>
{% endblock %}
