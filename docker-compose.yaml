version: '3.8'
services:
  web:
    build: .
    # Porty nie są już publikowane na hoście, komunikacja odbywa się przez sieć dockerową
    # ports:
    #   - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - PASSWORD_PEPPER=${PASSWORD_PEPPER}
    volumes:
      - ./instance:/home/appuser/app/instance
    # Polecenie jest teraz w Dockerfile, ale można je tu nadpisać w razie potrzeby
    # command: gunicorn -w 4 -b 0.0.0.0:8000 "src:create_app()"
  nginx:
    image: nginx:1.21-alpine
    ports:
      - "80:80"
      - "443:443" # Dodajemy port 443 dla HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      # Montujemy certyfikaty SSL do kontenera Nginx
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - web